    ENFXDatabase.prototype._makeStore = function(name, def) {
      var db = this;
      return {
        getAll: function() { return db._state[name] || def; },
        set: function(arr) { db._write(name, arr); },
        add: function(item) {

        reset: name === 'products' ? function() { db._write('products', SEED_PRODUCTS); } : undefined
      };
    };

    ENFXDatabase.prototype._write = function(storeName, data) {
      this._state[storeName] = data;
      lsSet(LS_KEYS[storeName], data);
      this._idbWrite(storeName, data);
      this._emit(storeName + ':change', data);
      this._emit('change', { store: storeName, data: data });

      this._listeners[event].push(fn);

    ENFXDatabase.prototype._emit = function(event, data) {

    ENFXDatabase.prototype._idbReadAll = function(cb) {
      var self = this;
      if (!this._idb) { if(cb) cb(); return; }
      var stores = ['products','cart','orders'];
      var done = 0;
      stores.forEach(function(name){

              lsSet(LS_KEYS[name], e.target.result);
            }
            if (++done === stores.length && cb) cb();
          };
          req.onerror = function() { if (++done === stores.length && cb) cb(); };

          lsSet(LS_KEYS[storeName], msg.data);
          self._emit(msg.type, msg.data);
          self._emit('change', { store: storeName, data: msg.data, fromTab: true });
        }
      };
    };

      if (this._channel) { try { this._channel.postMessage(msg); } catch(e){} }

          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === 'auth') {
          [523.25, 659.25, 1046.50].forEach((freq, idx) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(freq, now + idx * 0.08);
            g.gain.setValueAtTime(0.06, now + idx * 0.08);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            o.connect(g);
            g.connect(ctx.destination);
            o.start(now + idx * 0.08);
            o.stop(now + 0.55);
          });
        } else if (type === 'checkout') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(freq, now + idx * 0.05);
            g.gain.setValueAtTime(0.06, now + idx * 0.05);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            o.connect(g);
            g.connect(ctx.destination);
            o.start(now + idx * 0.05);
            o.stop(now + 0.65);
          });
        }
      } catch (e) {}
    };

                            <div className="p-3 rounded-xl bg-black/40 border border-white/10">
                              <div className="text-white/50 text-[10px] uppercase mb-1">Schema Version</div>
                              <div className="text-white font-bold">v2</div>
                            </div>
                          </div>
                        </div>

                        {/* Record Counts */}
                        <div className="grid grid-cols-3 gap-4">
                          <div className="p-4 rounded-2xl bg-white/[0.03] border border-white/10 text-center">
                            <div className="text-3xl font-bold text-[#9D14FF] font-sans">{productsList.length}</div>
                            <div className="text-[10px] font-mono text-white/50 mt-1 uppercase">Products</div>
                            <div className="text-[9px] font-mono text-white/30">enfx_db_products</div>
                          </div>
                          <div className="p-4 rounded-2xl bg-white/[0.03] border border-white/10 text-center">
                            <div className="text-3xl font-bold text-[#D4F856] font-sans">{cart.length}</div>
                            <div className="text-[10px] font-mono text-white/50 mt-1 uppercase">Cart Items</div>
                            <div className="text-[9px] font-mono text-white/30">enfx_db_cart</div>
                          </div>
                          <div className="p-4 rounded-2xl bg-white/[0.03] border border-white/10 text-center">
                            <div className="text-3xl font-bold text-green-400 font-sans">{ordersList.length}</div>
                            <div className="text-[10px] font-mono text-white/50 mt-1 uppercase">Orders</div>
                            <div className="text-[9px] font-mono text-white/30">enfx_db_orders</div>
                          </div>
                        </div>

                        {/* Developer API Hint */}
                        <div className="p-4 rounded-2xl bg-black/60 border border-white/10 space-y-2">
                          <div className="text-[10px] font-mono text-white/50 uppercase mb-2">// DevTools Console API (try in F12)</div>
                          {[
                            'window.ENFXDB.inspect()',
                            'window.ENFXDB.products.getAll()',
                            'window.ENFXDB.cart.getAll()',
                            'window.ENFXDB.orders.getAll()',
                            'window.ENFXDB.products.update("p1", { price: 19999 })',
                            'window.ENFXDB.exportJSON()',
                          ].map((cmd) => (
                            <div key={cmd} className="flex items-center justify-between group">
                              <code className="text-[10px] text-[#9D14FF] font-mono">{cmd}</code>
                              <button
                                onClick={() => { try { navigator.clipboard.writeText(cmd); setToast('Copied: ' + cmd); setTimeout(() => setToast(null), 2000); } catch(e){} }}
                                className="text-[9px] text-white/30 group-hover:text-[#D4F856] font-mono transition-colors px-1"
                              >
                                COPY
                              </button>
                            </div>
                          ))}
                        </div>

                        {/* Actions */}
                        <div className="flex flex-wrap gap-3">
                          <button
                            onClick={() => {
                              const json = window.ENFXDB.exportJSON();
                              const blob = new Blob([json], { type: 'application/json' });
                              const url = URL.createObjectURL(blob);
                              const a = document.createElement('a'); a.href = url; a.download = 'enfx_db_export.json'; a.click();
                              URL.revokeObjectURL(url);
                              setToast('Database exported as enfx_db_export.json');
                              setTimeout(() => setToast(null), 2500);
                            }}
                            className="px-4 py-2 rounded-xl bg-[#9D14FF]/20 hover:bg-[#9D14FF]/40 text-[#9D14FF] text-xs font-mono border border-[#9D14FF]/40 transition-colors"
                          >
                            ↓ Export JSON Snapshot
                          </button>
                          <button
                            onClick={() => {
                              window.ENFXDB.cart.clear();
                              setToast('Cart cleared via ENFXDB');
                              setTimeout(() => setToast(null), 2000);
                            }}
                            className="px-4 py-2 rounded-xl bg-yellow-500/10 hover:bg-yellow-500/25 text-yellow-400 text-xs font-mono border border-yellow-500/30 transition-colors"
                          >
                            Clear Cart DB
                          </button>
                          <button
                            onClick={() => {
                              if (window.confirm('⚠ NUKE ALL DATA? Products reset to default, Cart & Orders cleared. Continue?')) {
                                window.ENFXDB.nukeAll();
                                setToast('All data nuked and reset to defaults');
                                setTimeout(() => setToast(null), 3000);
                              }
                            }}
                            className="px-4 py-2 rounded-xl bg-red-500/10 hover:bg-red-500/25 text-red-400 text-xs font-mono border border-red-500/30 transition-colors"
                          >
                            ⚡ Nuke All Data
                          </button>
                        </div>

                        <p className="text-[10px] font-mono text-white/30">
                          Cross-tab sync enabled. Open multiple browser tabs and watch cart & product changes reflect instantly everywhere.
                        </p>
                      </div>
                    )}

                  </div>
                )}
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-2xl bg-[#0c0512] border border-[#D4F856] shadow-glow-lime text-xs font-bold text-white flex items-center space-x-3 backdrop-blur-xl animate-fadeIn">
              <span>{toast}</span>
              <button
                onClick={() => setIsBagOpen(true)}
                className="text-[10px] text-[#D4F856] underline uppercase font-mono"
              >
                View Bag
              </button>
            </div>
          )}

          {/* ------------------------------------------------------------- */}
          {/* 14. LUXURY FOOTER (enfx.in)                                   */}
          {/* ------------------------------------------------------------- */}
          <footer className="border-t border-white/10 py-12 px-4 sm:px-8 max-w-7xl mx-auto space-y-6">
            <div className="flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center space-x-3">
                <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-[#9D14FF] to-[#D4F856] p-[1px]">
                  <div className="w-full h-full bg-[#0A0A0C] rounded-[6px] flex items-center justify-center font-bold text-xs text-white">
                    ENFX
                  </div>
                </div>
                <div className="flex flex-col">
                  <span className="text-lg font-bold tracking-[0.2em] font-sans">ENFX E COMMERCE</span>
                  <span className="text-[10px] font-mono text-[#D4F856] -mt-1">enfx.in</span>
                </div>
              </div>

              <div className="flex items-center space-x-4 text-xs font-mono text-white/60">
                <button
                  onClick={() => setIsTokensModalOpen(true)}
                  className="hover:text-[#D4F856] transition-colors underline"
                >
                  View Design Tokens 🎨
                </button>
                <span>•</span>
                <button onClick={replayIntro} className="hover:text-[#D4F856] transition-colors underline">
                  Replay Intro Animation ↻
                </button>
                <span>•</span>
                <button onClick={() => setIsAdminOpen(true)} className="hover:text-[#D4F856] transition-colors">
                  System Admin (PIN: 2026)
                </button>
              </div>
            </div>

            <div className="flex flex-col sm:flex-row items-center justify-between text-xs font-mono text-white/40 pt-4 border-t border-white/5 gap-2">
              <div>© 2026 ENFX LABS INC. (enfx.in) ALL RIGHTS RESERVED.</div>
              <div className="text-[#D4F856]">
                Space Grotesk • #0A0A0C • #120917 • #9D14FF • #D4F856 • #670707 • #C858C6
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Mount Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
